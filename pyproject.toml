[project]
name = "cadria"
version = "0.1.0"
description = "CadrIA — copilote Django qui transforme une idée brute en brief projet actionnable"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.0,<6",
    "django>=6.0.7,<6.1",
    "django-environ>=0.14.0,<1",
    "gunicorn>=26.0.0,<27",
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.3.4,<4",
    "reportlab>=5.0.0",
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    "coverage[toml]>=7.10.0,<8",
    "ruff>=0.15.1,<0.16",
]

[tool.ruff]
line-length = 110
target-version = "py313"
exclude = ["**/migrations/", ".claude/", ".agents/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = [
    "RUF012", # Django class Meta fields are immutable in practice.
]

[tool.black]
line-length = 110
target-version = ["py313"]
extend-exclude = "/(migrations|\\.claude|\\.agents)/"

[tool.coverage.run]
branch = true
source = ["accounts", "briefs", "config"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
