x-app: &app
  build:
    context: .
  image: cadria:local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy

x-django-environment: &django-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
  SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
  DATABASE_URL: ${DATABASE_URL:-postgresql://cadria:local-development-only@db:5432/cadria}
  REDIS_URL: ${REDIS_URL:-redis://cache:6379/0}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
  AI_PROVIDER: ${AI_PROVIDER:-demo}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.mistral.ai/v1}
  AI_MODEL: ${AI_MODEL:-demo-cadria-v1}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
  AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-12000}
  AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-v1}
  GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
  GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-60}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}

services:
  web:
    <<: *app
    environment:
      <<: *django-environment
      RUN_STARTUP_TASKS: "True"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "90"
      - --access-logfile
      - "-"
    ports:
      - "${CADRIA_PORT:-8000}:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false
    environment:
      <<: *django-environment
      RUN_STARTUP_TASKS: "False"
      AI_API_KEY: ${AI_API_KEY:-}
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadria}
      POSTGRES_USER: ${POSTGRES_USER:-cadria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.32.3
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-2g}
    cpus: ${OLLAMA_CPU_LIMIT:-2.0}
    entrypoint: ["/bin/sh", "-c"]
    # Starts the native server, waits for it to accept commands, then pulls the
    # configured model if it is missing (idempotent: near-instant if already
    # present). This keeps `docker compose up --build` self-sufficient on a
    # fresh clone, with no separate manual pull step.
    command:
      - 'set -e; ollama serve & server_pid=$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull "$$OLLAMA_MODEL"; wait "$$server_pid"'
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -qF \"$$OLLAMA_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 240s

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  ollama_data:
